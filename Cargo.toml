[workspace]
members = [
  "crates/myhelp-cli",
  "crates/myhelp-core",
]
exclude = ["src-tauri"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hjosugi/myhelp"
rust-version = "1.85"

[workspace.dependencies]
atomic-write-file = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
rustix = { version = "1", features = ["fs"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
