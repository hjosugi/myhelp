[workspace]
members = [
  "crates/myhelp-cli",
  "crates/myhelp-core",
  "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/hjosugi/myhelp"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
walkdir = "2"
